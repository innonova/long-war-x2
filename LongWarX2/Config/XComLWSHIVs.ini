; Long War 1.0's SHIVs, generated by scripts/shivs-config.mjs from Long War's DefaultGameCore.ini. Do not edit by hand.
[LongWarX2.LWSHIVs]
; The SHIV (eChar_Tank); RepairHours: a wounded SHIV's base time in repair (BASE_DAYS_INJURED_TANK).
Base=(HP=8, Aim=70, Defense=0, Mobility=14, Sight=27)
RepairHours=24
; Rest and repair (Long War's code): RestHours + Rand(RestRollHours); RepairHours per HP lost, twice that per HP below a
; quarter, + Rand(max(half, RepairRollMin)); x RepairFoundryScale with the Foundry's RepairFoundry (Vehicle Repair).
RestHours=24
RestRollHours=24
RepairRollMin=96
RepairFoundry=5
RepairFoundryScale=0.67
; Bodies: Item, the character Template, its Deck (item) and the deck's HP, Defense, Mobility, SmallItems, Fly and Fuel;
; RepairHP: hit points beyond the deck's that repair restores (Long War's "base hp bonuses that require repair").
+Bodies=(Item=100, Template=LWSHIV, Deck=113, HP=2, Defense=12, Mobility=3, SmallItems=3, Fly=false, Fuel=0, RepairHP=0)
+Bodies=(Item=101, Template=LWSHIV_Alloy, Deck=114, HP=4, Defense=8, Mobility=2, SmallItems=3, Fly=false, Fuel=0, RepairHP=10)
+Bodies=(Item=102, Template=LWSHIV_Hover, Deck=115, HP=2, Defense=12, Mobility=5, SmallItems=3, Fly=true, Fuel=6, RepairHP=6)
; Weapons: Damage, Crit, Aim, Environment; Ammo: shots between reloads (iSuppression's last two digits).
+Weapons=(Item=109, Enum=eItem_ShivMinigun, Template=LWSHIV_Minigun, Damage=7, Crit=0, Aim=0, Environment=30, Ammo=3)
+Weapons=(Item=110, Enum=eItem_ShivSentry, Template=LWSHIV_Sentry, Damage=9, Crit=0, Aim=0, Environment=40, Ammo=4)
+Weapons=(Item=111, Enum=eItem_ShivLaser, Template=LWSHIV_Laser, Damage=10, Crit=8, Aim=0, Environment=65, Ammo=3)
+Weapons=(Item=112, Enum=eItem_ShivPlasma, Template=LWSHIV_Plasma, Damage=11, Crit=4, Aim=8, Environment=125, Ammo=3)
