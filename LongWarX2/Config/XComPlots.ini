; Long War X2's own plot for Enemy Within's maps (features/lw-missions.md, "real XCOM 2 maps"): a plot type of its own,
; so nothing of XCOM 2's (its parcels, its lighting by type, its missions) is chosen for it, and its plots.
[XComGame.XComParcelManager]
+arrPlotTypes=(strType="LWX2_EW", MissionSiteDescriptionTemplate="Wilderness", bUseEmptyClosedEntrances=true, MinCivilianCount=0)
; The template plot (Content/LWX2_EWPlotTemplate.umap, made in the SDK editor from tools/maps/template.py): a level volume,
; a spawn, one parcel slot. The plots made from it for each converted EW map are listed by the setup program.
+arrPlots=(MapName="LWX2_EWPlotTemplate", strType="LWX2_EW", ExcludeFromStrategy=true, ValidBiomes[0]="Arid", ObjectiveTags[0]="LWX2_EW")
