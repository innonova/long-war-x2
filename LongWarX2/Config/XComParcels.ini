; The parcel XCOM 2 streams into the slot of a Long War X2 plot as its objective parcel: an empty map of our own
; (Content/LWX2_EmptyParcel.umap), so no XCOM 2 parcel (its props, cars, doors) is loaded into an Enemy Within map. Large:
; the template plot's slot is 32 x 32 tiles, which XCOM 2 counts as large (a parcel of another size never fits it).
[XComGame.XComParcelManager]
+arrAllParcelDefinitions=(MapName="LWX2_EmptyParcel", eSize=eParcelSizeType_Large, arrPlotTypes[0]=(strPlotType="LWX2_EW"), eFacing=EParcelFacingType_N, ObjectiveTags[0]="LWX2_EW")
