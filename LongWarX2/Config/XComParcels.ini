; The parcel XCOM 2 streams into the slot of a Long War X2 plot as its objective parcel: an empty map of our own
; (Content/LWX2_EmptyParcel.umap), so no XCOM 2 parcel (its props, cars, doors) is loaded into an Enemy Within map.
[XComGame.XComParcelManager]
+arrAllParcelDefinitions=(MapName="LWX2_EmptyParcel", eSize=eParcelSizeType_Small, arrPlotTypes[0]=(strPlotType="LWX2_EW"), eFacing=EParcelFacingType_N, ObjectiveTags[0]="LWX2_EW")
