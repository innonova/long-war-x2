; Long War 1.0's council missions, generated by scripts/council-config.mjs from the Tree's data/council.json. Do not edit by hand.
[LongWarX2.LWCouncil]
; XGFundingCouncil.SetupMonthlyRequests: the hours to the month's council mission, FirstHours + rand(FirstRand).
FirstHours=336
FirstRand=336
; RandMoneyRewardAmount: MinMoney + 5 x rand((MaxMoney - MinMoney) / 5 + 1); CreateMission: rewards x RewardLowMult before
; day RewardLowDays, x RewardMedMult before RewardMedDays; a reward soldier of SoldierLevels[0..2] by the same days.
MinMoney=100
MaxMoney=225
RewardLowDays=21
RewardLowMult=0.5
RewardMedDays=41
RewardMedMult=0.75
SoldierLevels[0]=1
SoldierLevels[1]=2
SoldierLevels[2]=3
; Progeny (EW's new-game option EnableProgeny; the port has no such option, so it is on as EW's box comes ticked).
ProgenyEnabled=true
; Missions (BuildMission): Id (EFCMission), Kind (1 assault, 2 bomb, 3 extraction, 4 rescue), its EW Map, PanicOnFailure
; (on its continent); Rewards: Type 1 cash (Money: x the rolled amount), 3 a soldier (SoldierClass, SoldierLevel; -1 rolled),
; 4 scientists, 5 engineers, 6 the country's panic, 8 elerium (Amount), 9 a named soldier of Soldiers= (the n-th of the
; mission's: Amount). Special: offered by its own rule, not the kinds' rotation (25 to 27 Progeny: a chain; 29 the
; Chryssalid hive: after day 35 once a Chryssalid corpse was ever held, once); Country: its own country.
; Map: its EW map, Level: the streamed level with its variant (DefaultMaps.ini).
; Not in DefaultMaps.ini, so never offered: 15 (Mission Variant Urban Boulevard Extraction).
