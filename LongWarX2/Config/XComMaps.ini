; The light of a mission on an Enemy Within map (features/lw-missions.md): its plot (UILWHeadquarters.EWPlot, XCOM 2's empty
; test plot) gets a lighting map of its own, which XCOM 2 then takes over those of the plot's type: a clear day, never rain
; (which the Wilderness type can have) and no heavy weather fog.
[XComGame.XComEnvLightingManager]
+arrEnvironmentLightingDefs=(MapName="EnvLighting_Day_Arid", eEnvLighting[0]=eEnvLighting_Day, eTimeOfDay=eTimeOfDay_Noon, eMood=eMood_Normal, eWeatherCondition=eWeatherType_Clear, arrPlotMaps[0]="Plot_WLD_Test_Lg")
