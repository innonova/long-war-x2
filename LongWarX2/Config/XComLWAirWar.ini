; The Long War headquarters screen on the Avenger (experiment 4; a preview in the player's build).
[LongWarX2.UIScreenListener_LongWarX2HQ]
ShowLWHeadquarters=true
; and in a mission of a campaign, a button that ends it as won (in the player's build too, to try the strategy layer).
ShowTestEndMission=true

; Long War's Geoscape in place of XCOM 2's world map, whose clock (dark events, supply drops, its missions) then never runs.
[LongWarX2.UIScreenListener_LWX2StrategyMap]
ReplaceStrategyMap=true

; For development: the game driven from outside (tools/test/lw.sh): a TCP port taking commands, 0 = off.
[LongWarX2.LWX2Control]
ControlPort=7531

; For development: in a mission, each Long War soldier's shot breakdown against the nearest enemies, logged.
[LongWarX2.LWX2PerkProbe]
ProbePerks=true

; For development: on the Avenger, rookies promoted to Corporal in Long War's classes, to look at them.
[LongWarX2.UIScreenListener_LongWarX2TestBarracks]
PromoteRookies=true

; For development: the main menu's test campaign (a new campaign without its first mission).
[LongWarX2.UIScreenListener_LongWarX2Shell]
ShowTestCampaign=true
; An Enemy Within map converted on this machine, opened as it is (experiment 2).
TestMapURL="CSmallScout_Badlands?game=Engine.GameInfo"

; For development: an EW map's geometry on the Tactical Quick Launch screen (experiment 2;
; tools/convert/ew-map.ts writes its pieces to XComLWX2EWMap.ini in the mod's Config).
[LongWarX2.UIScreenListener_LongWarX2QuickLaunch]
PlaceEWMap=false
; Away from the map the screen generates; the debug camera (from there) south of the EW map's UFO, above it, looking at it.
Origin=(X=-20000, Y=-20000, Z=0)
CameraPosition=(X=-7440, Y=-500, Z=1700)
CameraDirection=(X=0, Y=2, Z=-1)

; For development: an Enemy Within unit beside the first soldier in a mission, when its converted
; package is in the mod's Content folder (features/hard-parts.md, experiment 1).
[LongWarX2.UIScreenListener_LongWarX2Tactical]
; Off since 2026-11-01: with the EW map in place no alien pod spawns (they stand where the hidden map had them; features/lw-missions.md).
ShowEWUnit=false
; and the EW map in the mission (experiment 2), placed on the Tactical Quick Launch screen once it has generated a map: the whole
; map in place of the generated one, or its crashed UFO and what is around it in front of the squad.
PlaceEWMapWhole=false
PlaceEWMapPart=false
; Long War's squad written into XCOM 2's alien encounters before the map loads (LWMissionSquads.ApplyTo); off: XCOM 2's own.
SquadsInEncounters=true
[LongWarX2.UILWHeadquarters]
; The pause (seconds) between a mission's launch and its map loading, and (development) a voice started at launch: the load crash (features/lw-missions.md).
LaunchDelay=1.5
TestVoiceAtLaunch=false
; A mission on an Enemy Within map is played on this plot (our own: Config/XComPlots.ini), with this biome and our own
; mission (Config/XComMissionDefs.ini): nothing of XCOM 2's around the EW map (features/lw-missions.md).
EWPlot="LWX2_EWPlotTemplate"
EWBiome="Arid"
EWMission="LWX2_EWMission"
; For development: every Long War mission played as this kind (1 crash site, 2 landed UFO, 3 abduction, 4 terror; 0: its own).
ForceKind=0
PartCenter=(X=-7440, Y=2544, Z=192)
PartRadius=1400
PartOffset=(X=0, Y=1400, Z=0)
[LongWarX2.UILWEWMapBackdrop]
; Enemy Within's earth behind the Situation Room: a colour (Flash setColor fills the image with it: "" for none) and its opacity.
EarthTint=""
EarthAlpha=50
[LongWarX2.LWX2PartPlacer]
; The fog of war on an Enemy Within map: ground not yet seen drawn as seen before (off: XCOM 2 draws that grey); the two fog
; levels, 0 for XCOM 2's own (features/lw-missions.md).
FogNeverSeenAsHaveSeen=false
FogNeverSeen=0
FogHaveSeen=0
; Each building's floors given their actors as the mission starts, so XCOM 2's building visibility cuts roofs away (lw-missions.md).
CacheBuildingFloors=true
[LongWarX2.LWX2EWUnitDisplay]
MeshPath="GameUnit_XComFloater_SF.SM_MedFloater"
AnimSetPath="GameUnit_XComFloater_SF.AS_HeavyFloaterRifle"
IdleAnim="AC_NO_IdleA"
; Its material made in the game from its own textures (the converted package has them uncompressed); MaterialPath: one made in the editor.
StandinParent="Materials.Approved.AlienUnit_TC"
DiffusePath="CHA_MedFloater_MOD.Maps.MedFloater_DIF"
NormalPath="CHA_MedFloater_MOD.Maps.MedFloater_NRM"
ParentCarrier="GameUnit_Sectoid.ARC_GameUnit_Sectoid"
MaterialPath="LWX2_Floater.MedFloater_DIF_Mat"
