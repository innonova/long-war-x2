; Long War's starting kit for each of its classes (their SquaddieLoadout), generated by scripts/classes-config.mjs
; from scripts/lw-gear.mjs (GetInfinitePrimary). Do not edit by hand.
[XComGame.X2ItemTemplateManager]
+Loadouts=(LoadoutName="LWS_SquaddieSniper", Items[0]=(Item="LWWeapon_213"), Items[1]=(Item="LWWeapon_2"))
+Loadouts=(LoadoutName="LWS_SquaddieScout", Items[0]=(Item="LWWeapon_212"), Items[1]=(Item="LWWeapon_2"))
+Loadouts=(LoadoutName="LWS_SquaddieRocketeer", Items[0]=(Item="LWWeapon_212"), Items[1]=(Item="LWSmall_218"))
+Loadouts=(LoadoutName="LWS_SquaddieGunner", Items[0]=(Item="LWWeapon_214"))
+Loadouts=(LoadoutName="LWS_SquaddieMedic", Items[0]=(Item="LWWeapon_212"), Items[1]=(Item="LWWeapon_2"))
+Loadouts=(LoadoutName="LWS_SquaddieEngineer", Items[0]=(Item="LWWeapon_212"), Items[1]=(Item="LWWeapon_2"))
+Loadouts=(LoadoutName="LWS_SquaddieAssault", Items[0]=(Item="LWWeapon_4"), Items[1]=(Item="LWWeapon_2"))
+Loadouts=(LoadoutName="LWS_SquaddieInfantry", Items[0]=(Item="LWWeapon_212"), Items[1]=(Item="LWWeapon_2"))
; Long War's soldiers carry as many grenades and medikits as they have small slots (a charge each): XCOM 2's one-each rule lifted.
-UniqueEquipCategories=grenade
-UniqueEquipCategories=heal
; Long War's weapon categories (which classes may carry a weapon; XComLWGear.ini, scripts/gear-config.mjs) made known
; to the item manager (unknown, every Long War weapon template was reported invalid in the log).
+WeaponCategories=lw_gunner
+WeaponCategories=lw_scout_medic_engineer_assault_infantry
+WeaponCategories=lw_scout_rocketeer_medic_engineer_assault_infantry
+WeaponCategories=lw_sniper
+WeaponCategories=lw_sniper_scout
+WeaponCategories=lw_sniper_scout_medic_engineer_assault_infantry
+WeaponCategories=lw_sniper_scout_rocketeer_gunner_medic_engineer_assault_infantry
; Long War's Secondary Heart is asked before a soldier dies (X2Effect_LWSecondaryHeart).
[XComGame.X2AbilityTemplateManager]
+PreDeathCheckEffects=LWSecondaryHeart
; A recruit costs Long War's SOLDIER_COST on every difficulty (XCOM 2 asks more on Legend).
[XComGame.XComGameState_HeadquartersResistance]
RecruitSupplyCosts[0]=25
RecruitSupplyCosts[1]=25
RecruitSupplyCosts[2]=25
RecruitSupplyCosts[3]=25
