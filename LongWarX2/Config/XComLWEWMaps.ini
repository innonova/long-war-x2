; Enemy Within's base as the strategy layer's scene (LWX2EWBase, features/lw-base-view.md): where its coordinates go in the
; strategy world (below the Avenger's), and its fixed rooms (Command1's always-loaded Static_ levels).
[LongWarX2.LWX2EWBase]
; Mission Control's hologlobe turns once in this many seconds (0: still).
GlobeSeconds=120
; Where EW's flat earth lies on the globe's mesh: longitude 0's yaw in the mesh, and longitude running the other way (found
; with the control port's 'globe' test aid: markers at 0°/0°, 90°E/0° and 0°/45°N against the texture).
GlobeLonOffset=104
bGlobeMirrored=true
; Degrees of the mesh's turn per degree of longitude (the texture lies on the mesh a little more than once round).
GlobeLonScale=0.85
BaseOffset=(X=0, Y=0, Z=-60000)
; A view of the base in place of EW's own camera (tagged Base): where it stands in EW's coordinates and its field of view.
; 0: EW's own, as EW shows its base (the rooms at the top, close). (1100, 9000, -3600) at 70 shows the whole base.
ViewLoc=(X=1100, Y=9000, Z=-3600)
ViewFOV=0
; The lighting level streamed in at the base while it is in view, for an even ambient light (its sun and fog off).
BaseLighting="EnvLighting_Day_Arid"
; EW's screens on their 3D panels in the rooms (features/ew-3d-screens.md): the panels' mesh and material (XCOM 2's,
; whose material takes the 3D movie in its Movie parameter), scaled from EW's.
ScreensIn3D=true
SatellitesOnWall=true
DisplayMesh="Strat_Overworld.Meshes.UI_Plate_A"
DisplayMaterial="Strat_Overworld.Materials.UIDisplayMaterial_Overworld"
DisplayScale=155.0
DisplayTurn=(Pitch=0,Yaw=16384,Roll=16384)
; (A display of ours in place of EW's panels of a tag: +PlateDisplays=(Tag=..., Loc=..., Rot=..., Scale=...). The Situation
; Room's wall had one until EW's own wall meshes took their slices of the movie: they do with the movie at EW's size.)
; XCOM 2's squad select in EW's hangar, where EW lined its squad up in front of the Skyranger: through EW's camera for
; it, the soldiers in a row this far in front of it, this far apart, standing on this floor (EW's coordinates).
; EW's lights in the base at this brightness (1: EW's own, dim without its lightmaps; the mission maps placed at run time
; take LightScale). Its sky lights are left out: spawned in XCOM 2's strategy world they lit the base saturated red at times.
BaseLightScale=3
SquadInHangar=true
; XCOM 2's armory screens in EW's armory, through its own armory cameras, the soldier ArmoryDistance in front (UIScreenListener_LWArmory).
ArmoryInBase=true
; XCOM 2's screens on EW's panels: the screen's display tag, EW's panel (Command1's tag) and EW's camera for it.
+ScreenDisplays=(Screen=UIBlueprint_ArmoryMenu, Panel=UIDisplay_SoldierSummary, Camera=Armory_UIDisplayCam_Summary)
+ScreenDisplays=(Screen=UIBlueprint_Loadout, Panel=UIDisplay_SoldierLoadout, Camera=Armory_UIDisplayCam_Loadout)
+ScreenDisplays=(Screen=UIBlueprint_Promotion, Panel=UIDisplay_SoldierPromote, Camera=Armory_UIDisplayCam_Promote)
+ScreenDisplays=(Screen=UIBlueprint_Promotion_Hero, Panel=UIDisplay_SoldierPromote, Camera=Armory_UIDisplayCam_Promote)
+ScreenDisplays=(Screen=UIBlueprint_CustomizeMenu, Panel=UIDisplay_SoldierCustomize, Camera=Armory_UIDisplayCam_Customize)
+ScreenDisplays=(Screen=UIBlueprint_CustomizeHead, Panel=UIDisplay_SoldierCustomize, Camera=Armory_UIDisplayCam_Customize)
+ScreenDisplays=(Screen=UIBlueprint_CustomizeLegs, Panel=UIDisplay_SoldierCustomize, Camera=Armory_UIDisplayCam_Customize)
