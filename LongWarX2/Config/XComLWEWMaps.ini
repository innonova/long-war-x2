; Enemy Within's maps for Long War's missions, generated by scripts/maps-config.mjs from Long War's
; DefaultMaps.ini: 44 abduction, 39 crash site, 21 landed UFO and 22 terror maps;
; EXALT's 8 covert extraction and 10 data recovery maps (Level: the variant level). Do not edit by hand.
[LongWarX2.LWX2EWMapPieces]
; The converted map a quick launch places (no campaign to choose one).
DefaultMap="CSmallScout_Badlands"
; For development: this converted map for every Long War mission, whatever its kind ("": Long War's list decides).
ForceMap=""
; EW's lights (point, spot, its sun and sky), spawned as movable lights: the kinds placed and a scale on their
; brightness (3: EW's lightmaps carried bounced light too; judged by eye on CSmallScout_Badlands).
LightScale=3
; In a map's own plot (tools/convert/ew-plot.ts), under XCOM 2's sun: EW's lights at their own brightness.
PlotLightScale=1
; EW's buildings in the plot as XCOM 2 building and floor volumes, so its building visibility cuts roofs away
; (off for a day while the crash it was suspected of was found elsewhere, features/lw-missions.md).
PlotBuildings=true
; EW's walls as XCOM 2's breakable walls (its fracturable actors, EW's toughness as XCOM 2's): explosions break them.
PlotFracWalls=true
+LightKinds=Point
+LightKinds=Spot
+LightKinds=Sun
+LightKinds=Sky
; XCOM 2 cannot draw EW's materials: each is replaced by an instance of one of these parents
; (by the kind of the EW material) given the EW textures. Empty: the EW materials are kept.
PropParent="Materials.Approved.Props_SD"
; EW's baked lighting (features/ew-lightmaps.md): the lightmapped stand-ins' parent, our own material (tools/materials),
; on EW's base and on EW's mission maps, and its brightness. Pieces without a lightmap keep the plain stand-ins.
LightmapParent="LWX2Lightmap.M_EWLightmapped"
LightmapBase=true
LightmapMaps=false
LightmapBrightness=1.0
; EW's glowing parts (light rings and strips, consoles' screens: Kind=Glow in the converted data): our own unlit
; material (as EW's glows are unlit), in EW's colour (its TintColor, HDR), the base's teal where EW colours by vertex.
; (XCOM 2's Objective_UI with GlowColorParam=ObjectiveUIColor also works, darker.)
GlowParent="LWX2Lightmap.M_EWLightmapped"
GlowColorParam=ObjectiveUIColor
GlowDefault=(R=0.42,G=1.18,B=2.0,A=1.0)
; EW's light cards (HQ_ColorizedLight_PureVertexColor: coloured and faded by the mesh's vertex colours): our additive
; card material, which reads them (the Genetics Lab's tanks' glow, the Psi Labs' lamps).
LightCardParent="LWX2Lightmap.M_EWLightCard"
+LightCardMaterials="PureVertexColor"
LightCardScale=1.0
GlowScale=1.0
; Drawn unlit with their own picture in UnlitTint (the base's hologlobe, glowing as EW's).
+UnlitMaterials="M_Globe_Holo"
UnlitTint=(R=1.6,G=2.4,B=2.8,A=1)
FoliageParent="Materials.Approved.Vegetations_VO"
MaskedParent="Materials.Approved.Props_OpcMask_TC"
AlienParent="Materials.Approved.Alien_Props"
; The base's hologlobe (Mission Control): EW's holographic earth, made teal by the setup (tools/convert/ew-earth.ts), in
; place of its own copy's raw channels (red borders, green cities, blue land).
+LookOverrides=(Material="Command1.QX_Globe.M_Globe_Holo", Diffuse="FX_Globe.T_Earth_Holo", Load="EWSitRoomMap.TheWorld")
; (And the main menu scene's, EW's shell map: LWX2EWBase.ShowShell.)
+LookOverrides=(Material="XComShell.QX_Globe.M_Globe_Holo", Diffuse="FX_Globe.T_Earth_Holo", Load="EWSitRoomMap.TheWorld")
; The kinds cut out by the diffuse's alpha (Masked: EW's tree cards, signs, fences) take the diffuse as their Masks too:
; XCOM 2's masked parents read the opacity from one of the two, and the white placeholder made them solid.
DiffuseMasks="Foliage,Masked"
; Scalars set on every stand-in. The parents' placeholder mask (no EW texture fills it) made the surfaces glossy
; and grey; no specular reads cleanly (features/lw-missions.md, compared on URB_HighwayFallen).
+StandinScalars=(Name=SpecularScale, Value=0)
; and textures: the parents' mask (XCOM 2's packed light channels) white, which is their own value when a material
; has no mask (their NoMasksMap switch puts 1 in every channel); the placeholder in its place darkened every surface.
+StandinTextures=(Name=Masks, Path="EngineResources.WhiteSquareTexture")
; EW materials without a diffuse map, as the plot writer treats them (tools/convert/ew-plot.ts): skipped (markers,
; skies, decal-like effects an opaque stand-in draws as slabs; EW's DoNothing, which draws nothing), glass a translucent
; pane, a name ending in Black black,
; anything else plain grey. (Placed at run time: EW's base, a quick launch's map.)
+SkipMaterials="Drop_Zone"
; EW's 3D screens (UIDisplayMaterial: EW draws a movie on them, as Mission Control's interception display; here a grey slab).
+SkipMaterials="UIDisplayMaterial"
+SkipMaterials="DESIGN_Border"
+SkipMaterials="Sky"
+SkipMaterials="RoadPaint"
+SkipMaterials="Puddle"
+SkipMaterials="Decal"
+SkipMaterials="Scar"
+SkipMaterials="Asphalt_Patch"
+SkipMaterials="Burning"
+SkipMaterials="Charred"
+SkipMaterials="DoNothing"
; In EW's base, DoNothing is drawn black: EW's cutaway's cut surfaces between rooms and floors (LWX2EWMapPieces.BaseBlackMaterials).
+BaseBlackMaterials="DoNothing"
+GlassMaterials="Glass"
+GlassMaterials="Window"
GlassParent="Materials.Approved.Translucent_SD"
GlassOpacity=0.2
; Where XCOM 2's translucent parent is not loaded (EW's base, the strategy layer): our own unlit pane, faint.
GlassOwnParent="LWX2Lightmap.M_EWGlass"
GlassTint=(R=0.55,G=0.65,B=0.7,A=1)
GlassOwnOpacity=0.12
BaseGlass=true
GreyTint=(R=0.35, G=0.35, B=0.35, A=1)
