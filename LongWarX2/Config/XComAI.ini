-Behaviors=(BehaviorName=TryMoveThenBlazingPinions, NodeType=Selector, Child[0]=TryMoveForBlazingPinions, Child[1]=TryBlazingPinions)
+Behaviors=(BehaviorName=TryMoveThenBlazingPinions, NodeType=Sequence, Child[0]=IsAbilityAvailable-LW_Launch, Child[1]=ResetDestinationSearch, Child[2]=RestrictToFlanking, Child[3]=UseDashMovement, Child[4]=FindDestinationWithLoS-MWP_Teleport, Child[5]=SelectAbility-LW_Launch)
