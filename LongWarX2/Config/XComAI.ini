; Long War's aliens' own abilities in XCOM 2's AI (features/lw-aliens.md). XCOM 2's AI uses an ability only where its
; behaviour tree names it; the species' abilities come from XComLWAliens.ini (+Ability, LWAlienStats).
[XComGame.X2AIBTBehaviorTree]

; ---- The Sectoid (and the Sectoid Commander, the same template): the Commander's Mind Control on a soldier first (a
; plain Sectoid has none), Long War's Mind Merge on an ally, else Psi Panic or Mindfray on a soldier, where XCOM 2's tree tried its Psi Reanimation and Mindspin (taken off Long War's Sectoids).
-Behaviors=(BehaviorName=TryPsiReanimationOrMindSpinOption, NodeType=RandSelector, Child[0]=TryPsiReanimation, Param[0]=66, Child[1]=TryMindSpinOption, Param[1]=34)
+Behaviors=(BehaviorName=TryPsiReanimationOrMindSpinOption, NodeType=Selector, Child[0]=TryLWMindControl, Child[1]=TryLWMindMerge, Child[2]=TryLWPsiAttack)
+Behaviors=(BehaviorName=TryLWPsiAttack, NodeType=RandSelector, Child[0]=TryLWPsiPanic, Param[0]=50, Child[1]=TryLWMindfray, Param[1]=50)

+Behaviors=(BehaviorName=IsAbilityAvailable-LW_MindMerge, NodeType=Condition)
+Behaviors=(BehaviorName=SetTargetStack-LW_MindMerge, NodeType=Action)
+Behaviors=(BehaviorName=HasValidTarget-LW_MindMerge, NodeType=Condition)
+Behaviors=(BehaviorName=SelectAbility-LW_MindMerge, NodeType=Action)
+Behaviors=(BehaviorName=TryLWMindMerge, NodeType=Sequence, Child[0]=IsAbilityAvailable-LW_MindMerge, Child[1]=SelectTargetForLWMindMerge, Child[2]=SelectAbility-LW_MindMerge)
+Behaviors=(BehaviorName=SelectTargetForLWMindMerge, NodeType=Sequence, Child[0]=SetTargetStack-LW_MindMerge, Child[1]=GenericSelectTargetSomewhatRandomly, Child[2]=HasValidTarget-LW_MindMerge)

+Behaviors=(BehaviorName=IsAbilityAvailable-LW_PsiPanic, NodeType=Condition)
+Behaviors=(BehaviorName=SetTargetStack-LW_PsiPanic, NodeType=Action)
+Behaviors=(BehaviorName=HasValidTarget-LW_PsiPanic, NodeType=Condition)
+Behaviors=(BehaviorName=SelectAbility-LW_PsiPanic, NodeType=Action)
+Behaviors=(BehaviorName=TryLWPsiPanic, NodeType=Sequence, Child[0]=IsAbilityAvailable-LW_PsiPanic, Child[1]=SelectTargetForLWPsiPanic, Child[2]=SelectAbility-LW_PsiPanic)
+Behaviors=(BehaviorName=SelectTargetForLWPsiPanic, NodeType=Sequence, Child[0]=SetTargetStack-LW_PsiPanic, Child[1]=SelectBestTargetForLWPsi, Child[2]=HasValidTarget-LW_PsiPanic)

+Behaviors=(BehaviorName=IsAbilityAvailable-LW_Mindfray, NodeType=Condition)
+Behaviors=(BehaviorName=SetTargetStack-LW_Mindfray, NodeType=Action)
+Behaviors=(BehaviorName=HasValidTarget-LW_Mindfray, NodeType=Condition)
+Behaviors=(BehaviorName=SelectAbility-LW_Mindfray, NodeType=Action)
+Behaviors=(BehaviorName=TryLWMindfray, NodeType=Sequence, Child[0]=IsAbilityAvailable-LW_Mindfray, Child[1]=SelectTargetForLWMindfray, Child[2]=SelectAbility-LW_Mindfray)
+Behaviors=(BehaviorName=SelectTargetForLWMindfray, NodeType=Sequence, Child[0]=SetTargetStack-LW_Mindfray, Child[1]=SelectBestTargetForLWPsi, Child[2]=HasValidTarget-LW_Mindfray)

+Behaviors=(BehaviorName=IsAbilityAvailable-LW_MindControl, NodeType=Condition)
+Behaviors=(BehaviorName=SetTargetStack-LW_MindControl, NodeType=Action)
+Behaviors=(BehaviorName=HasValidTarget-LW_MindControl, NodeType=Condition)
+Behaviors=(BehaviorName=SelectAbility-LW_MindControl, NodeType=Action)
+Behaviors=(BehaviorName=TryLWMindControl, NodeType=Sequence, Child[0]=IsAbilityAvailable-LW_MindControl, Child[1]=SelectTargetForLWMindControl, Child[2]=SelectAbility-LW_MindControl)
+Behaviors=(BehaviorName=SelectTargetForLWMindControl, NodeType=Sequence, Child[0]=SetTargetStack-LW_MindControl, Child[1]=SelectBestTargetForLWPsi, Child[2]=HasValidTarget-LW_MindControl)

; A psi attack's target as XCOM 2 picks one for its Sectoid's Mindspin.
+Behaviors=(BehaviorName=SelectBestTargetForLWPsi, NodeType=RepeatUntilFail, Child[0]=PsiEvaluateTargetsGeneric)

; ---- The Muton: Long War's Blood Call (its allies near it gain aim, will and mobility; once a battle), where XCOM 2's
; tree tried its bayonet (taken off Long War's Mutons).
-Behaviors=(BehaviorName=TryBayonet, NodeType=Sequence, Child[0]=IsAbilityReady-Bayonet, Child[1]=BayonetStepSelector)
+Behaviors=(BehaviorName=TryBayonet, NodeType=Sequence, Child[0]=IsAbilityAvailable-LW_BloodCall, Child[1]=SelectAbility-LW_BloodCall)
+Behaviors=(BehaviorName=IsAbilityAvailable-LW_BloodCall, NodeType=Condition)
+Behaviors=(BehaviorName=SelectAbility-LW_BloodCall, NodeType=Action)

; ---- The Drone (XCOM 2's ADVENT MEC Mk1's tree): Long War's repair of a damaged machine ally, where XCOM 2's tree tried
; its micro missiles (taken off Long War's Drones).
-Behaviors=(BehaviorName=TryMicroMissiles, NodeType=Sequence, Child[0]=IsAbilityAvailable-MicroMissiles, Child[1]=FindPotentialAoETargets-MicroMissilesProfile, Child[2]=SelectAoETarget-MicroMissilesProfile, Child[3]=SelectAbility-MicroMissiles)
; The Drone's Overload first (its suicide mode: LW_Overload's own condition, many enemies in sight and two near), else its repair.
+Behaviors=(BehaviorName=TryMicroMissiles, NodeType=Selector, Child[0]=TryLWOverload, Child[1]=TryLWRepair)
+Behaviors=(BehaviorName=TryLWOverload, NodeType=Sequence, Child[0]=IsAbilityAvailable-LW_Overload, Child[1]=SelectAbility-LW_Overload)
+Behaviors=(BehaviorName=IsAbilityAvailable-LW_Overload, NodeType=Condition)
+Behaviors=(BehaviorName=SelectAbility-LW_Overload, NodeType=Action)
+Behaviors=(BehaviorName=TryLWRepair, NodeType=Sequence, Child[0]=IsAbilityAvailable-LW_Repair, Child[1]=SelectTargetForLWRepair, Child[2]=SelectAbility-LW_Repair)
+Behaviors=(BehaviorName=IsAbilityAvailable-LW_Repair, NodeType=Condition)
+Behaviors=(BehaviorName=SetTargetStack-LW_Repair, NodeType=Action)
+Behaviors=(BehaviorName=HasValidTarget-LW_Repair, NodeType=Condition)
+Behaviors=(BehaviorName=SelectAbility-LW_Repair, NodeType=Action)
+Behaviors=(BehaviorName=SelectTargetForLWRepair, NodeType=Sequence, Child[0]=SetTargetStack-LW_Repair, Child[1]=GenericSelectTargetSomewhatRandomly, Child[2]=HasValidTarget-LW_Repair)

; ---- The Cyberdisc (XCOM 2's Gatekeeper's tree): Long War's Death Blossom where the tree tried its Anima Consume (taken off).
-Behaviors=(BehaviorName=TryAnimaConsumeOnEnemy, NodeType=Sequence, Child[0]=HasWounds, Child[1]=IsAbilityReady-AnimaConsume, Child[2]=AnimaConsumeStepSelectorEnemy)
+Behaviors=(BehaviorName=TryAnimaConsumeOnEnemy, NodeType=Sequence, Child[0]=IsAbilityAvailable-LW_DeathBlossom, Child[1]=SelectAbility-LW_DeathBlossom)
+Behaviors=(BehaviorName=IsAbilityAvailable-LW_DeathBlossom, NodeType=Condition)
+Behaviors=(BehaviorName=SelectAbility-LW_DeathBlossom, NodeType=Action)

; ---- The Floater (XCOM 2's Archon's tree): Long War's Launch to a spot flanking a soldier (as EW's AI chose one; the search
; is XCOM 2's Codex's offensive teleport's), as its first action, where the tree tried Blazing Pinions (taken off Long War's
; Floaters).
-Behaviors=(BehaviorName=TryMoveThenBlazingPinions, NodeType=Selector, Child[0]=TryMoveForBlazingPinions, Child[1]=TryBlazingPinions)
+Behaviors=(BehaviorName=TryMoveThenBlazingPinions, NodeType=Sequence, Child[0]=IsAbilityAvailable-LW_Launch, Child[1]=ResetDestinationSearch, Child[2]=RestrictToFlanking, Child[3]=UseDashMovement, Child[4]=FindDestinationWithLoS-MWP_Teleport, Child[5]=SelectAbility-LW_Launch)
+Behaviors=(BehaviorName=IsAbilityAvailable-LW_Launch, NodeType=Condition)
+Behaviors=(BehaviorName=SelectAbility-LW_Launch, NodeType=Action, param[0]=UseDestination)

; ---- The Seeker (XCOM 2's Faceless's tree): Long War's Strangle on a soldier within reach (its target chosen as the Viper's
; Bind's), else its cloak as its first action, where the tree tried its Scything Claws; the tree's move toward a melee
; target stays.
-Behaviors=(BehaviorName=TryScythingClaws, NodeType=Sequence, Child[0]=IsAbilityAvailable-ScythingClaws, Child[1]=SelectTargetForScythingClaws, Child[2]=SelectAbility-ScythingClaws)
+Behaviors=(BehaviorName=TryScythingClaws, NodeType=Selector, Child[0]=TryLWStrangle, Child[1]=TryLWSeekerCloak)
+Behaviors=(BehaviorName=TryLWStrangle, NodeType=Sequence, Child[0]=IsAbilityAvailable-LW_Strangle, Child[1]=SelectTargetForLWStrangle, Child[2]=SelectAbility-LW_Strangle)
+Behaviors=(BehaviorName=TryLWSeekerCloak, NodeType=Sequence, Child[0]=NotLastActionPoint, Child[1]=IsAbilityAvailable-LW_SeekerCloak, Child[2]=SelectAbility-LW_SeekerCloak)
+Behaviors=(BehaviorName=IsAbilityAvailable-LW_SeekerCloak, NodeType=Condition)
+Behaviors=(BehaviorName=SelectAbility-LW_SeekerCloak, NodeType=Action)
+Behaviors=(BehaviorName=SelectTargetForLWStrangle, NodeType=Sequence, Child[0]=SetTargetStack-LW_Strangle, Child[1]=SelectBestTargetForBind, Child[2]=HasValidTarget-LW_Strangle)
+Behaviors=(BehaviorName=IsAbilityAvailable-LW_Strangle, NodeType=Condition)
+Behaviors=(BehaviorName=SetTargetStack-LW_Strangle, NodeType=Action)
+Behaviors=(BehaviorName=HasValidTarget-LW_Strangle, NodeType=Condition)
+Behaviors=(BehaviorName=SelectAbility-LW_Strangle, NodeType=Action)

; ---- The Berserker: Long War's Bloodlust, a move out of its turn when a soldier hurts it (X2Ability_LWAliens.Bloodlust):
; into melee reach of a soldier, else toward the nearest.
+Behaviors=(BehaviorName=LWBloodlustRoot, NodeType=Selector, Child[0]=MoveMeleeFANATICUnsafe, Child[1]=HuntEnemyUnsafe)

