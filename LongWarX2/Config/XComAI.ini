; Long War's aliens' own abilities in XCOM 2's AI (features/lw-aliens.md). XCOM 2's AI uses an ability only where its
; behaviour tree names it; the species' abilities come from XComLWAliens.ini (+Ability, LWAlienStats).
[XComGame.X2AIBTBehaviorTree]

; ---- The Sectoid (and the Sectoid Commander, the same template): Long War's Mind Merge on an ally, else Psi Panic or
; Mindfray on a soldier, where XCOM 2's tree tried its Psi Reanimation and Mindspin (taken off Long War's Sectoids).
-Behaviors=(BehaviorName=TryPsiReanimationOrMindSpinOption, NodeType=RandSelector, Child[0]=TryPsiReanimation, Param[0]=66, Child[1]=TryMindSpinOption, Param[1]=34)
+Behaviors=(BehaviorName=TryPsiReanimationOrMindSpinOption, NodeType=Selector, Child[0]=TryLWMindMerge, Child[1]=TryLWPsiAttack)
+Behaviors=(BehaviorName=TryLWPsiAttack, NodeType=RandSelector, Child[0]=TryLWPsiPanic, Param[0]=50, Child[1]=TryLWMindfray, Param[1]=50)

+Behaviors=(BehaviorName=IsAbilityAvailable-LW_MindMerge, NodeType=Condition)
+Behaviors=(BehaviorName=SetTargetStack-LW_MindMerge, NodeType=Action)
+Behaviors=(BehaviorName=HasValidTarget-LW_MindMerge, NodeType=Condition)
+Behaviors=(BehaviorName=SelectAbility-LW_MindMerge, NodeType=Action)
+Behaviors=(BehaviorName=TryLWMindMerge, NodeType=Sequence, Child[0]=IsAbilityAvailable-LW_MindMerge, Child[1]=SelectTargetForLWMindMerge, Child[2]=SelectAbility-LW_MindMerge)
+Behaviors=(BehaviorName=SelectTargetForLWMindMerge, NodeType=Sequence, Child[0]=SetTargetStack-LW_MindMerge, Child[1]=GenericSelectTargetSomewhatRandomly, Child[2]=HasValidTarget-LW_MindMerge)

+Behaviors=(BehaviorName=IsAbilityAvailable-LW_PsiPanic, NodeType=Condition)
+Behaviors=(BehaviorName=SetTargetStack-LW_PsiPanic, NodeType=Action)
+Behaviors=(BehaviorName=HasValidTarget-LW_PsiPanic, NodeType=Condition)
+Behaviors=(BehaviorName=SelectAbility-LW_PsiPanic, NodeType=Action)
+Behaviors=(BehaviorName=TryLWPsiPanic, NodeType=Sequence, Child[0]=IsAbilityAvailable-LW_PsiPanic, Child[1]=SelectTargetForLWPsiPanic, Child[2]=SelectAbility-LW_PsiPanic)
+Behaviors=(BehaviorName=SelectTargetForLWPsiPanic, NodeType=Sequence, Child[0]=SetTargetStack-LW_PsiPanic, Child[1]=SelectBestTargetForLWPsi, Child[2]=HasValidTarget-LW_PsiPanic)

+Behaviors=(BehaviorName=IsAbilityAvailable-LW_Mindfray, NodeType=Condition)
+Behaviors=(BehaviorName=SetTargetStack-LW_Mindfray, NodeType=Action)
+Behaviors=(BehaviorName=HasValidTarget-LW_Mindfray, NodeType=Condition)
+Behaviors=(BehaviorName=SelectAbility-LW_Mindfray, NodeType=Action)
+Behaviors=(BehaviorName=TryLWMindfray, NodeType=Sequence, Child[0]=IsAbilityAvailable-LW_Mindfray, Child[1]=SelectTargetForLWMindfray, Child[2]=SelectAbility-LW_Mindfray)
+Behaviors=(BehaviorName=SelectTargetForLWMindfray, NodeType=Sequence, Child[0]=SetTargetStack-LW_Mindfray, Child[1]=SelectBestTargetForLWPsi, Child[2]=HasValidTarget-LW_Mindfray)

; A psi attack's target as XCOM 2 picks one for its Sectoid's Mindspin.
+Behaviors=(BehaviorName=SelectBestTargetForLWPsi, NodeType=RepeatUntilFail, Child[0]=PsiEvaluateTargetsGeneric)
