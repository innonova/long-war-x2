; Long War's Rift aimed as XCOM 2 aims its Dimensional Rift: where it catches three of XCOM's, none of the aliens.
+AoEProfiles=(Profile=LWRiftProfile, Ability=LW_Rift, MinTargets=3, bFailOnFriendlyFire=1, bFailOnObjectiveFire=False)
