[Engine.ScriptPackages]
+NonNativePackages=LongWarX2

; The SDK's compiler (make -mods) compiles only the packages named here, the
; mod's own included (seen 2026-10-31: without it, nothing of ours compiled).
[UnrealEd.EditorEngine]
+ModEditPackages=LongWarX2

; XCOM 2's soldier list rows: an officer's rank shown as Long War's officer rank (LT, CAPT …) in place of the
; soldier's rank, as Long War names its officers (UIPersonnel_LWSoldierListItem).
[Engine.Engine]
+ModClassOverrides=(BaseGameClass="UIPersonnel_SoldierListItem", ModClass="UIPersonnel_LWSoldierListItem")
+ModClassOverrides=(BaseGameClass="UISoldierHeader", ModClass="UISoldierHeader_LW")
; Commander's Choice (second wave #18): the class chosen on promotion from rookie (UIArmory_LWMainMenu).
+ModClassOverrides=(BaseGameClass="UIArmory_MainMenu", ModClass="UIArmory_LWMainMenu")
; XCOM 2's base view (the Avenger's facility grid) replaced: Long War's root over an inert, invisible grid
; (UILWFacilityGrid; features/strategy-flow.md).
+ModClassOverrides=(BaseGameClass="UIFacilityGrid", ModClass="UILWFacilityGrid")
+ModClassOverrides=(BaseGameClass="UIInventory_LootRecovered", ModClass="UILWLootRecovered")
+ModClassOverrides=(BaseGameClass="UIAfterAction", ModClass="UILWAfterAction")
+ModClassOverrides=(BaseGameClass="UIDropShipBriefing_MissionStart", ModClass="UILWDropShipBriefing")
