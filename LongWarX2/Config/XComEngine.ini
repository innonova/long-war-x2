[Engine.ScriptPackages]
+NonNativePackages=LongWarX2

; The SDK's compiler (make -mods) compiles only the packages named here, the
; mod's own included (seen 2026-10-31: without it, nothing of ours compiled).
[UnrealEd.EditorEngine]
+ModEditPackages=LongWarX2

; XCOM 2's soldier list rows: an officer's rank shown as Long War's officer rank (LT, CAPT …) in place of the
; soldier's rank, as Long War names its officers (UIPersonnel_LWSoldierListItem).
[Engine.Engine]
+ModClassOverrides=(BaseGameClass="UIPersonnel_SoldierListItem", ModClass="UIPersonnel_LWSoldierListItem")
